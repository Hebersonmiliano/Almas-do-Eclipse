name: Validar e preparar teste
on:
  push:
    branches: [teste]
  pull_request:
    branches: [teste, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-teste-${{ github.sha }}
          path: dist/
          retention-days: 14
